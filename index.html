<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧪 Trạm Hóa Học Khám Phá 🧪</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ================= CÀI ĐẶT CHUNG ================= */
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh; overflow-x: hidden; color: #2d3436;
        }
        .hidden { display: none !important; }
        
        .bubble {
            position: fixed; border-radius: 50%; background: rgba(255,255,255,0.4);
            animation: floatUp 8s infinite ease-in-out; z-index: -1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }

        .btn {
            padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer;
            font-size: 1.1rem; font-weight: 800; text-transform: uppercase;
            color: white; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15); display: inline-block;
        }
        .btn:active { transform: scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #6e8efb, #a777e3); }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); width: 100%; font-size: 1.3rem; margin-top: 15px; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-warning { background: linear-gradient(135deg, #f6d365, #fda085); color: #2d3436; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            border-radius: 30px; padding: 25px; max-width: 800px; width: 92%;
            margin: 20px auto; box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 2px solid rgba(255,255,255,0.8); text-align: center;
        }

        /* ================= MODAL MẬT KHẨU ẨN ================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1000; display: flex; justify-content: center; align-items: center;
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 25px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

        /* ================= TRANG GIÁO VIÊN ================= */
        .admin-nav {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 25px;
            background: #f1f2f6; padding: 10px; border-radius: 20px;
        }
        .admin-tab {
            flex: 1; padding: 12px; border-radius: 15px; cursor: pointer;
            font-weight: 800; font-size: 1.1rem; transition: 0.3s;
            color: #636e72; background: transparent; border: none;
        }
        .admin-tab.active { background: white; color: #6c5ce7; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        textarea {
            width: 100%; height: 160px; padding: 15px; border-radius: 15px;
            border: 2px dashed #a29bfe; font-size: 1rem; outline: none; resize: none;
            background: #f8f9fa; line-height: 1.5;
        }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 15px; overflow: hidden; }
        .leaderboard-table th { background: #6c5ce7; color: white; padding: 12px; }
        .leaderboard-table td { padding: 12px; background: white; border-bottom: 1px solid #f1f2f6; font-weight: 600; text-align: center;}
        .rank-1 td { color: #d35400; font-weight: 900; background: #ffeaa7 !important; }

        /* ================= TRANG HỌC SINH (GAME) ================= */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 20px; border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .badge { background: #e0f7fa; color: #0097a6; padding: 5px 15px; border-radius: 15px; font-weight: 800; }
        .timer-badge { background: #ffeaa7; color: #d63031; padding: 5px 15px; border-radius: 15px; font-weight: 900; font-size: 1.2rem; }

        .target-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px;
            padding-bottom: 100px; 
        }
        
        .target-card {
            background: white; border-radius: 20px; padding: 15px 10px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.04); border: 2px solid transparent; transition: 0.3s;
        }
        .target-card.active-drop { border-color: #74b9ff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(116, 185, 255, 0.3); }

        .drop-circle {
            width: 60px; height: 60px; border-radius: 50%;
            background: #f1f2f6; border: 3px dashed #b2bec3; margin-bottom: 10px; 
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; cursor: pointer; font-size: 1.5rem; font-weight: 900; color: #0984e3;
        }
        .target-name { font-size: 1rem; font-weight: 800; color: #2d3436; text-align: center; }

        /* THANH DOCK KÝ HIỆU - ĐÃ FIX SCROLL HOÀN HẢO */
        .symbol-dock {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 600px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            border-radius: 35px; padding: 15px;
            
            /* Sửa lỗi scroll */
            display: flex; 
            flex-wrap: nowrap; /* Ép không được xuống dòng */
            overflow-x: auto; /* Cho phép cuộn ngang */
            overflow-y: hidden;
            gap: 12px;
            
            -webkit-overflow-scrolling: touch; /* Cuộn mượt trên iOS */
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15); 
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* Làm đẹp thanh cuộn ngang (Scrollbar) cho PC/Android */
        .symbol-dock::-webkit-scrollbar { height: 6px; }
        .symbol-dock::-webkit-scrollbar-track { background: transparent; }
        .symbol-dock::-webkit-scrollbar-thumb { background: #b2bec3; border-radius: 10px; }
        
        .symbol-item {
            flex-shrink: 0; /* QUAN TRỌNG: Ép các thẻ không bị bóp méo khi quá nhiều */
            width: 55px; height: 55px; border-radius: 50%;
            background: linear-gradient(135deg, #74b9ff, #0984e3); color: white;
            font-size: 1.3rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(9, 132, 227, 0.4);
            cursor: pointer; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }
        .symbol-item.selected {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            transform: scale(1.15) translateY(-10px); box-shadow: 0 10px 20px rgba(225, 112, 85, 0.5);
        }

        @media (max-width: 400px) {
            .target-grid { grid-template-columns: repeat(2, 1fr); }
            .symbol-item, .drop-circle { width: 50px; height: 50px; font-size: 1.1rem;}
        }
    </style>
</head>
<body>

    <div class="bubble" style="width: 50px; height: 50px; left: 10%; animation-duration: 6s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; left: 80%; animation-duration: 9s;"></div>
    <div class="bubble" style="width: 40px; height: 40px; left: 40%; animation-duration: 5s;"></div>

    <!-- MÀN HÌNH MẶC ĐỊNH LÀ SẢNH NHẬP TÊN -->
    <div id="lobby-screen" class="glass-panel">
        <h1 style="color: #6c5ce7; font-size: 2rem;">✨ TRẠM HÓA HỌC ✨</h1>
        <p style="color: #636e72;">Nhập tên nhóm để bắt đầu thử thách</p>
        
        <input type="text" id="group-name" placeholder="👉 Nhập tên nhóm của bạn..." style="width: 90%; padding: 15px; border-radius: 20px; border: 2px solid #74b9ff; font-size: 1.2rem; text-align: center; margin: 20px 0; outline: none; font-family: inherit;">
        <button class="btn btn-primary" style="font-size: 1.4rem; padding: 15px 40px;" onclick="startGame()">VÀO CHƠI NGAY!</button>
    </div>

    <!-- MODAL HỎI MẬT KHẨU GIÁO VIÊN (Ẩn) -->
    <div id="password-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: #d63031; margin-top: 0;">🔒 Xác nhận Giáo Viên</h2>
            <p style="color: #636e72; font-size: 0.9rem;">Vui lòng nhập mật mã quản trị:</p>
            <input type="password" id="admin-pass" placeholder="Nhập mật khẩu..." style="width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #dfe6e9; font-size: 1.2rem; text-align: center; margin-bottom: 20px; outline: none;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" onclick="checkPassword()">Đăng nhập</button>
                <button class="btn btn-warning" onclick="closePasswordModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- ================= GÓC GIÁO VIÊN ================= -->
    <div id="admin-screen" class="glass-panel hidden" style="max-width: 900px;">
        <div class="admin-nav">
            <button class="admin-tab active" id="tab-btn-setup" onclick="switchAdminTab('setup')">⚙️ Cài đặt Đề thi</button>
            <button class="admin-tab" id="tab-btn-result" onclick="switchAdminTab('result')">🏆 Bảng Kết quả Live</button>
        </div>

        <div id="admin-setup">
            <h3 style="color: #2d3436; text-align: left;">📥 Nạp Dữ Liệu (Copy từ Excel dán vào):</h3>
            <textarea id="data-input" placeholder="H	Hydro&#10;O	Oxy&#10;Na	Natri&#10;Fe	Sắt&#10;Cl	Clo&#10;C	&#10;Au	"></textarea>
            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="saveGameData()">💾 LƯU & KHỞI TẠO BÀI TẬP</button>
            <br><br><button class="btn btn-warning" style="font-size: 0.9rem;" onclick="location.reload()">🏠 Trở lại trang Chủ</button>
        </div>

        <div id="admin-result" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: #d63031; margin: 0;">🔴 Tự động làm mới liên tục</h3>
                <button class="btn btn-danger" style="padding: 5px 15px; font-size: 0.9rem;" onclick="clearLeaderboard()">🗑️ Xóa điểm cũ</button>
            </div>
            <table class="leaderboard-table">
                <thead><tr><th>Hạng</th><th>Tên Nhóm / Học sinh</th><th>Điểm</th><th>Thời gian</th></tr></thead>
                <tbody id="admin-leaderboard"></tbody>
            </table>
        </div>
    </div>

    <!-- ================= GÓC HỌC SINH ================= -->
    <div id="game-screen" class="hidden" style="max-width: 800px; margin: 10px auto; padding: 10px;">
        <div class="game-header">
            <div class="badge">👤 <span id="display-group"></span></div>
            <div class="timer-badge">⏳ <span id="time-left">60</span>s</div>
        </div>

        <div class="target-grid" id="targets-grid"></div>

        <button class="btn btn-success" style="margin-bottom: 120px;" onclick="endGame(false)">✅ NỘP BÀI</button>

        <div class="symbol-dock" id="symbol-dock"></div>
    </div>

    <!-- KẾT QUẢ SINH VIÊN -->
    <div id="result-screen" class="glass-panel hidden">
        <h1 style="color: #e17055; font-size: 2.5rem; margin-bottom: 10px;">XUẤT SẮC! 🎉</h1>
        <div style="background: #f1f2f6; padding: 20px; border-radius: 25px; margin-bottom: 20px;">
            <h2 id="final-score" style="color: #00b894; margin: 0; font-size: 2rem;"></h2>
            <p id="final-time" style="color: #636e72; font-weight: 800; font-size: 1.2rem; margin-top: 10px;"></p>
        </div>
        <button class="btn btn-primary" onclick="location.reload()">🔄 Về màn hình chính</button>
    </div>

<script>
    /* --- BIẾN TOÀN CỤC --- */
    let gameData = JSON.parse(localStorage.getItem('chemDataV5')) || { elements: [], distractors: [] };
    let selectedSymbol = null;
    let timerInterval; let adminInterval;
    let timeLeft = 60; let startTime; let groupName = "";

    /* --- CHUYỂN TRANG --- */
    function showScreen(screenId) {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        
        document.getElementById(screenId).classList.remove('hidden');

        if(screenId === 'admin-screen') {
            document.getElementById('data-input').value = gameData.rawText || "H\tHydro\nO\tOxy\nNa\tNatri\nFe\tSắt\nC\t\nAu\t";
            switchAdminTab('setup');
        }
    }

    /* --- LOGIC ĐĂNG NHẬP ẨN CỦA GIÁO VIÊN --- */
    function startGame() {
        groupName = document.getElementById("group-name").value.trim();
        if (!groupName) return alert("Nhập tên nhóm đi bạn ơi!");

        // 1. Kiểm tra nếu là Giáo viên (Mã: QuynhTrang)
        if (groupName === "QuynhTrang") {
            document.getElementById('password-modal').classList.remove('hidden');
            return; // Dừng lại, không khởi chạy game
        }

        // 2. Nếu là Học sinh bình thường
        if(!gameData.elements || gameData.elements.length === 0) {
            return alert("Thầy cô chưa nạp đề thi, em hãy chờ một chút nhé!");
        }

        document.getElementById('display-group').innerText = groupName;
        showScreen('game-screen');
        buildGameBoard();

        timeLeft = 60; startTime = Date.now();
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("time-left").innerText = timeLeft;
            if (timeLeft <= 0) endGame(true);
        }, 1000);
    }

    // Xử lý nút Đăng nhập trong Modal
    function checkPassword() {
        let pass = document.getElementById('admin-pass').value;
        if (pass === "123456@") {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('admin-pass').value = '';
            document.getElementById('group-name').value = ''; // Xóa tên để lớp sau chơi
            showScreen('admin-screen');
        } else {
            alert("❌ Sai mật khẩu! Vui lòng thử lại.");
            document.getElementById('admin-pass').value = '';
        }
    }

    // Xử lý nút Hủy trong Modal
    function closePasswordModal() {
        document.getElementById('password-modal').classList.add('hidden');
        document.getElementById('admin-pass').value = '';
    }

    /* ================= HỆ THỐNG GIÁO VIÊN ================= */
    function switchAdminTab(tab) {
        document.getElementById('tab-btn-setup').classList.remove('active');
        document.getElementById('tab-btn-result').classList.remove('active');
        document.getElementById('tab-btn-' + tab).classList.add('active');

        document.getElementById('admin-setup').classList.add('hidden');
        document.getElementById('admin-result').classList.add('hidden');
        document.getElementById('admin-' + tab).classList.remove('hidden');

        if(tab === 'result') {
            refreshAdminLeaderboard();
            if(!adminInterval) adminInterval = setInterval(refreshAdminLeaderboard, 1000);
        } else {
            clearInterval(adminInterval);
            adminInterval = null;
        }
    }

    function saveGameData() {
        const text = document.getElementById('data-input').value;
        const lines = text.split('\n');
        let elements = [], distractors = [];

        lines.forEach(line => {
            const parts = line.split('\t');
            if (parts[0] && parts[0].trim() !== '') {
                const sym = parts[0].trim();
                const name = parts[1] ? parts[1].trim() : "";
                if (name === "") distractors.push(sym);
                else elements.push({ symbol: sym, name: name });
            }
        });

        if(elements.length === 0) return alert("❌ Dữ liệu không hợp lệ! Hãy kiểm tra khoảng cách Tab.");

        gameData = { elements, distractors, rawText: text };
        localStorage.setItem('chemDataV5', JSON.stringify(gameData));
        alert("🎉 Lưu thành công! Trò chơi đã sẵn sàng.");
    }

    function refreshAdminLeaderboard() {
        const lb = JSON.parse(localStorage.getItem("chemLeaderboardV5")) || [];
        const tbody = document.getElementById("admin-leaderboard");
        tbody.innerHTML = "";
        
        if (lb.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4' style='color:#636e72;'>Chưa có nhóm nào nộp bài...</td></tr>";
            return;
        }

        lb.forEach((t, i) => {
            let rowClass = i === 0 ? "rank-1" : "";
            let rankIcon = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : i + 1));
            tbody.innerHTML += `<tr class="${rowClass}"><td>${rankIcon}</td><td>${t.name}</td><td>${t.score}</td><td>${t.time}s</td></tr>`;
        });
    }

    function clearLeaderboard() {
        if(confirm("⚠️ Xóa sạch điểm để bắt đầu vòng thi mới?")) {
            localStorage.removeItem("chemLeaderboardV5");
            refreshAdminLeaderboard();
        }
    }

    /* ================= HỆ THỐNG GAME ================= */
    function buildGameBoard() {
        const dock = document.getElementById("symbol-dock");
        const grid = document.getElementById("targets-grid");
        dock.innerHTML = ''; grid.innerHTML = '';
        selectedSymbol = null;

        let allSymbols = [...gameData.elements.map(e => e.symbol), ...gameData.distractors].sort(() => Math.random() - 0.5);
        allSymbols.forEach(sym => {
            let item = document.createElement("div");
            item.className = "symbol-item"; item.innerText = sym;
            item.onclick = () => selectFromDock(item);
            dock.appendChild(item);
        });

        let shuffledElements = [...gameData.elements].sort(() => Math.random() - 0.5);
        shuffledElements.forEach(item => {
            let card = document.createElement("div");
            card.className = "target-card";
            
            let dropCircle = document.createElement("div");
            dropCircle.className = "drop-circle";
            dropCircle.dataset.correct = item.symbol;
            dropCircle.onclick = () => placeInTarget(dropCircle, card);
            
            let nameSpan = document.createElement("div");
            nameSpan.className = "target-name";
            nameSpan.innerText = item.name;
            
            card.appendChild(dropCircle); card.appendChild(nameSpan);
            grid.appendChild(card);
        });
    }

    function selectFromDock(item) {
        if(selectedSymbol) selectedSymbol.classList.remove("selected");
        if(selectedSymbol === item) { selectedSymbol = null; return; }
        selectedSymbol = item;
        selectedSymbol.classList.add("selected");
        
        document.querySelectorAll('.target-card').forEach(card => card.classList.add('active-drop'));
    }

    function placeInTarget(circle, card) {
        document.querySelectorAll('.target-card').forEach(c => c.classList.remove('active-drop'));

        if (circle.innerText !== "" && !selectedSymbol) {
            let oldText = circle.innerText;
            circle.innerText = "";
            circle.style.background = "#f1f2f6"; circle.style.color = "#0984e3";
            let item = document.createElement("div");
            item.className = "symbol-item"; item.innerText = oldText;
            item.onclick = () => selectFromDock(item);
            document.getElementById("symbol-dock").appendChild(item);
            return;
        }

        if (!selectedSymbol) return;

        if (circle.innerText !== "") {
            let oldText = circle.innerText;
            let oldItem = document.createElement("div");
            oldItem.className = "symbol-item"; oldItem.innerText = oldText;
            oldItem.onclick = () => selectFromDock(oldItem);
            document.getElementById("symbol-dock").appendChild(oldItem);
        }

        circle.innerText = selectedSymbol.innerText;
        circle.style.background = "#ffeaa7";
        circle.style.color = "#d63031";

        selectedSymbol.remove();
        selectedSymbol = null;
    }

    function endGame(isTimeOut) {
        clearInterval(timerInterval);
        let timeUsed = Math.floor((Date.now() - startTime) / 1000);
        if (timeUsed > 60) timeUsed = 60;

        let correctCount = 0;
        document.querySelectorAll(".drop-circle").forEach(circle => {
            if (circle.innerText === circle.dataset.correct) correctCount++;
        });

        let score = Math.round(correctCount * (100 / gameData.elements.length));
        
        let lb = JSON.parse(localStorage.getItem("chemLeaderboardV5")) || [];
        lb.push({ name: groupName, score: score, time: timeUsed });
        lb.sort((a, b) => (b.score === a.score) ? (a.time - b.time) : (b.score - a.score));
        localStorage.setItem("chemLeaderboardV5", JSON.stringify(lb));

        showScreen('result-screen');
        document.getElementById('final-score').innerText = `ĐIỂM: ${score} / 100`;
        document.getElementById('final-time').innerText = `⏱️ Thời gian thi: ${timeUsed} giây`;

        if(score >= 50) { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); }
    }
</script>
</body>
</html>
