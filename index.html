<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧪 Trạm Hóa Học Khám Phá 🧪</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- TÍCH HỢP FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); min-height: 100vh; color: #2d3436; transition: 0.3s; }
        
        /* KHÓA MÀN HÌNH KHI VÀO GAME (KHÔNG CUỘN) */
        body.in-game { overflow: hidden; height: 100vh; height: 100dvh; }
        
        .hidden { display: none !important; }
        .btn { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: white; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: inline-block; }
        .btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #6e8efb, #a777e3); }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); width: 100%; font-size: 1.3rem; padding: 12px; }
        .btn-warning { background: linear-gradient(135deg, #f6d365, #fda085); color: #2d3436; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 30px; padding: 20px; max-width: 800px; width: 92%; margin: 20px auto; box-shadow: 0 15px 30px rgba(0,0,0,0.1); text-align: center; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        
        textarea { width: 100%; height: 140px; padding: 15px; border-radius: 15px; border: 2px dashed #a29bfe; outline: none; resize: none; background: #f8f9fa; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 15px; overflow: hidden; }
        .leaderboard-table th { background: #6c5ce7; color: white; padding: 10px; }
        .leaderboard-table td { padding: 10px; background: white; border-bottom: 1px solid #f1f2f6; font-weight: 600; text-align: center;}
        
        /* ================= TỐI ƯU GIAO DIỆN GAME (KHÔNG CUỘN) ================= */
        #game-screen {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%; max-height: 100vh; max-height: 100dvh; 
            max-width: 800px; margin: 0 auto; padding: 10px;
        }

        .game-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .badge { background: #e0f7fa; color: #0097a6; padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 0.9rem;}
        .timer-badge { background: #ffeaa7; color: #d63031; padding: 5px 12px; border-radius: 12px; font-weight: 900; font-size: 1.1rem; }
        
        /* Lưới Ô trống gọn gàng (2 cột trên Mobile, 3 cột PC) */
        .compact-targets { 
            flex-grow: 1; /* Tự động co giãn lấp đầy khoảng trống */
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; 
            align-content: center; /* Căn giữa theo chiều dọc nếu ít thẻ */
        }
        @media (min-width: 600px) { .compact-targets { grid-template-columns: repeat(3, 1fr); } }
        
        /* Thẻ điền tên: Cấu trúc Nằm Ngang để siêu tiết kiệm diện tích */
        .target-card-compact { 
            background: white; border-radius: 15px; padding: 6px; 
            display: flex; align-items: center; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); border: 2px solid transparent; transition: 0.2s; 
        }
        .target-card-compact.active-drop { border-color: #74b9ff; transform: scale(1.02); box-shadow: 0 8px 15px rgba(116, 185, 255, 0.3); }
        
        .drop-circle-compact { 
            flex-shrink: 0; width: 45px; height: 45px; border-radius: 50%; 
            background: #f1f2f6; border: 2px dashed #b2bec3; margin-right: 8px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 1.2rem; font-weight: 900; color: #0984e3; transition: 0.2s;
        }
        .target-name-compact { font-size: 0.9rem; font-weight: 800; color: #2d3436; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Kho chứa Ký hiệu */
        .compact-pool { 
            flex-shrink: 0; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(5px); 
            border-radius: 20px; padding: 10px; margin-bottom: 10px;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }
        
        .symbol-item-compact { 
            width: 45px; height: 45px; border-radius: 12px; 
            background: linear-gradient(135deg, #74b9ff, #0984e3); color: white; 
            font-size: 1.2rem; font-weight: 900; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 8px rgba(9, 132, 227, 0.3); 
            cursor: pointer; transition: 0.2s; user-select: none; 
        }
        .symbol-item-compact.selected { 
            background: linear-gradient(135deg, #fdcb6e, #e17055); 
            transform: scale(1.15) rotate(5deg); box-shadow: 0 8px 15px rgba(225, 112, 85, 0.5); 
        }

        .submit-btn-container { flex-shrink: 0; }
        
        /* Dành cho màn hình điện thoại cực nhỏ (iPhone SE/5) */
        @media (max-height: 650px) {
            .target-card-compact { padding: 4px; }
            .drop-circle-compact, .symbol-item-compact { width: 38px; height: 38px; font-size: 1rem; }
            .target-name-compact { font-size: 0.8rem; }
            .btn-success { font-size: 1.1rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby-screen" class="glass-panel">
        <h1 style="color: #6c5ce7; font-size: 2rem;">✨ TRẠM HÓA HỌC ✨</h1>
        <p style="color: #636e72;">Nhập tên nhóm để bắt đầu thử thách</p>
        <input type="text" id="group-name" placeholder="👉 Nhập tên nhóm của bạn..." style="width: 90%; padding: 15px; border-radius: 20px; border: 2px solid #74b9ff; font-size: 1.2rem; text-align: center; margin: 20px 0; outline: none; font-family: inherit;">
        <button class="btn btn-primary" style="font-size: 1.3rem; padding: 12px 35px;" onclick="startGame()">VÀO CHƠI NGAY!</button>
    </div>

    <!-- ADMIN MODAL -->
    <div id="password-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="color: #d63031; margin-top: 0;">🔒 Giáo Viên</h2>
            <input type="password" id="admin-pass" placeholder="Nhập mật khẩu..." style="width: 100%; padding: 12px; border-radius: 15px; border: 2px solid #dfe6e9; font-size: 1.1rem; text-align: center; margin-bottom: 20px; outline: none;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" onclick="checkPassword()">Đăng nhập</button>
                <button class="btn btn-warning" onclick="closePasswordModal()">Hủy</button>
            </div>
        </div>
    </div>

    <!-- ADMIN SCREEN -->
    <div id="admin-screen" class="glass-panel hidden" style="max-width: 900px;">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn btn-warning" style="flex:1" onclick="switchAdminTab('setup')">⚙ Cài đặt Đề</button>
            <button class="btn btn-primary" style="flex:1" onclick="switchAdminTab('result')">🏆 Bảng Kết quả</button>
        </div>
        <div id="admin-setup">
            <textarea id="data-input" placeholder="H	Hydro&#10;O	Oxy&#10;Na	Natri"></textarea>
            <button class="btn btn-success" style="margin-top:10px" onclick="saveGameData()">💾 LƯU & PHÁT ĐỀ</button>
            <button class="btn btn-warning" style="margin-top:10px; width:100%" onclick="location.reload()">🏠 Thoát</button>
        </div>
        <div id="admin-result" class="hidden">
            <button class="btn btn-danger" style="margin-bottom:10px; width:100%" onclick="clearLeaderboard()">🗑 Xóa điểm cũ</button>
            <table class="leaderboard-table">
                <thead><tr><th>Hạng</th><th>Tên Nhóm</th><th>Điểm</th><th>TG</th></tr></thead>
                <tbody id="admin-leaderboard"></tbody>
            </table>
        </div>
    </div>

    <!-- GAME SCREEN (NO SCROLL) -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <div class="badge">👤 <span id="display-group"></span></div>
            <div class="timer-badge">⏳ <span id="time-left">60</span>s</div>
        </div>
        
        <!-- Khu vực đáp án tự co giãn -->
        <div class="compact-targets" id="targets-grid"></div>
        
        <!-- Kho chứa ký hiệu -->
        <div class="compact-pool" id="symbol-pool"></div>
        
        <div class="submit-btn-container">
            <button class="btn btn-success" onclick="endGame(false)">✅ NỘP BÀI</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="glass-panel hidden">
        <h1 id="result-title" style="color: #e17055; margin-bottom: 5px;"></h1>
        <p id="result-subtitle" style="color: #636e72; font-weight: bold; margin-bottom: 20px;"></p>
        <div style="background: #f1f2f6; padding: 20px; border-radius: 20px; margin-bottom: 20px;">
            <h2 id="final-score" style="color: #00b894; margin: 0; font-size: 2rem;"></h2>
            <p id="final-time" style="color: #636e72; font-weight: 800; font-size: 1.1rem; margin-top: 5px;"></p>
        </div>
        <button class="btn btn-primary" onclick="location.reload()">🔄 Về màn hình chính</button>
    </div>

<script>
    // ==========================================
    // 1. CẤU HÌNH FIREBASE 
    // !!! NHỚ THAY DÒNG API KEY CỦA BẠN VÀO ĐÂY NHÉ !!!
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDaFoGOeic30XPLeuKc1o8Pzr81JC95c9Y", 
        authDomain: "hocvui-bbb0f.firebaseapp.com",
        databaseURL: "https://hocvui-bbb0f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "hocvui-bbb0f",
        storageBucket: "hocvui-bbb0f.firebasestorage.app",
        messagingSenderId: "523616626949",
        appId: "1:523616626949:web:99fd474b8b2353bbbc6f6c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let gameData = { elements: [], distractors: [], rawText: "" };
    let selectedSymbol = null;
    let timerInterval; 
    let timeLeft = 60; let startTime; let groupName = "";

    // Firebase Listeners
    db.ref('chemData').on('value', (snapshot) => {
        if(snapshot.exists()) {
            gameData = snapshot.val();
            const dataInput = document.getElementById('data-input');
            if(dataInput) dataInput.value = gameData.rawText;
        }
    });

    db.ref('leaderboard').on('value', (snapshot) => {
        const tbody = document.getElementById("admin-leaderboard");
        if (!tbody) return;
        tbody.innerHTML = "";
        
        if (!snapshot.exists()) {
            tbody.innerHTML = "<tr><td colspan='4'>Chưa có dữ liệu...</td></tr>"; return;
        }

        let lb = [];
        snapshot.forEach((child) => { lb.push(child.val()); });
        lb.sort((a, b) => (b.score === a.score) ? (a.time - b.time) : (b.score - a.score));

        lb.forEach((t, i) => {
            let rowClass = i === 0 ? "rank-1" : "";
            let rankIcon = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : i + 1));
            let emoji = t.score <= 30 ? "😵‍💫" : (t.score <= 60 ? "🤔" : (t.score <= 80 ? "😎" : "🤩")); 
            tbody.innerHTML += `<tr class="${rowClass}"><td>${rankIcon}</td><td>${t.name}</td><td>${t.score} ${emoji}</td><td>${t.time}s</td></tr>`;
        });
    });

    // Navigation & Logic
    function showScreen(screenId) {
        document.querySelectorAll('body > div').forEach(el => el.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        
        // Khóa màn hình (Không cuộn) chỉ khi ở trong game-screen
        if(screenId === 'game-screen') document.body.classList.add('in-game');
        else document.body.classList.remove('in-game');
    }

    function startGame() {
        groupName = document.getElementById("group-name").value.trim();
        if (!groupName) return alert("Nhập tên nhóm đi bạn ơi!");
        if (groupName === "QuynhTrang") { document.getElementById('password-modal').classList.remove('hidden'); return; }
        if (!gameData.elements || gameData.elements.length === 0) return alert("Thầy cô chưa phát đề thi!");

        document.getElementById('display-group').innerText = groupName;
        showScreen('game-screen');
        buildGameBoard();

        timeLeft = 60; startTime = Date.now();
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("time-left").innerText = timeLeft;
            if (timeLeft <= 0) endGame(true);
        }, 1000);
    }

    function checkPassword() {
        if (document.getElementById('admin-pass').value === "123456@") {
            closePasswordModal();
            document.getElementById('group-name').value = ''; 
            showScreen('admin-screen');
        } else { alert("❌ Sai mật khẩu!"); }
    }
    function closePasswordModal() { document.getElementById('password-modal').classList.add('hidden'); document.getElementById('admin-pass').value = ''; }
    function switchAdminTab(tab) {
        document.getElementById('admin-setup').classList.add('hidden');
        document.getElementById('admin-result').classList.add('hidden');
        document.getElementById('admin-' + tab).classList.remove('hidden');
    }

    function saveGameData() {
        const text = document.getElementById('data-input').value;
        let elements = [], distractors = [];
        text.split('\n').forEach(line => {
            const parts = line.split('\t');
            if (parts[0] && parts[0].trim() !== '') {
                const sym = parts[0].trim();
                const name = parts[1] ? parts[1].trim() : "";
                if (name === "") distractors.push(sym); else elements.push({ symbol: sym, name: name });
            }
        });
        if(elements.length === 0) return alert("Lỗi: Dữ liệu trống!");
        db.ref('chemData').set({ elements, distractors, rawText: text }).then(() => alert("🎉 Lưu đề lên Cloud thành công!"));
    }
    function clearLeaderboard() { if(confirm("Xóa sạch điểm cũ?")) db.ref('leaderboard').remove(); }

    // Xây dựng Bàn chơi Tối ưu hiển thị
    function buildGameBoard() {
        const pool = document.getElementById("symbol-pool");
        const grid = document.getElementById("targets-grid");
        pool.innerHTML = ''; grid.innerHTML = ''; selectedSymbol = null;

        let allSymbols = [...gameData.elements.map(e => e.symbol), ...gameData.distractors].sort(() => Math.random() - 0.5);
        allSymbols.forEach(sym => {
            let item = document.createElement("div");
            item.className = "symbol-item-compact"; item.innerText = sym;
            item.onclick = () => selectFromPool(item);
            pool.appendChild(item);
        });

        let shuffledElements = [...gameData.elements].sort(() => Math.random() - 0.5);
        shuffledElements.forEach(item => {
            let card = document.createElement("div");
            card.className = "target-card-compact";
            
            let dropCircle = document.createElement("div");
            dropCircle.className = "drop-circle-compact";
            dropCircle.dataset.correct = item.symbol;
            dropCircle.onclick = () => placeInTarget(dropCircle, card);
            
            let nameSpan = document.createElement("div");
            nameSpan.className = "target-name-compact";
            nameSpan.innerText = item.name;
            
            card.appendChild(dropCircle); card.appendChild(nameSpan);
            grid.appendChild(card);
        });
    }

    function selectFromPool(item) {
        if(selectedSymbol) selectedSymbol.classList.remove("selected");
        if(selectedSymbol === item) { selectedSymbol = null; return; }
        selectedSymbol = item; selectedSymbol.classList.add("selected");
        document.querySelectorAll('.target-card-compact').forEach(card => card.classList.add('active-drop'));
    }

    function placeInTarget(circle, card) {
        document.querySelectorAll('.target-card-compact').forEach(c => c.classList.remove('active-drop'));

        if (circle.innerText !== "" && !selectedSymbol) {
            let oldText = circle.innerText;
            circle.innerText = ""; circle.style.background = "#f1f2f6"; circle.style.color = "#0984e3";
            let item = document.createElement("div"); item.className = "symbol-item-compact"; item.innerText = oldText;
            item.onclick = () => selectFromPool(item); document.getElementById("symbol-pool").appendChild(item); return;
        }

        if (!selectedSymbol) return;

        if (circle.innerText !== "") {
            let oldText = circle.innerText;
            let oldItem = document.createElement("div"); oldItem.className = "symbol-item-compact"; oldItem.innerText = oldText;
            oldItem.onclick = () => selectFromPool(oldItem); document.getElementById("symbol-pool").appendChild(oldItem);
        }

        circle.innerText = selectedSymbol.innerText;
        circle.style.background = "#ffeaa7"; circle.style.color = "#d63031";
        selectedSymbol.remove(); selectedSymbol = null;
    }

    function endGame(isTimeOut) {
        clearInterval(timerInterval);
        let timeUsed = Math.floor((Date.now() - startTime) / 1000);
        if (timeUsed > 60) timeUsed = 60;

        let correctCount = 0;
        document.querySelectorAll(".drop-circle-compact").forEach(circle => {
            if (circle.innerText === circle.dataset.correct) correctCount++;
        });

        let score = Math.round(correctCount * (100 / gameData.elements.length));
        db.ref('leaderboard').push({ name: groupName, score: score, time: timeUsed });

        let titleText = "", subtitleText = "";
        if (score <= 30) { titleText = "ỐI GIỜI ÔI! 😵‍💫"; subtitleText = "Sai hơi nhiều rồi nha! Về lật sách ôn bài ngay!"; } 
        else if (score <= 60) { titleText = "SUÝT NỮA THÌ GIỎI! 🤔"; subtitleText = "Cố lên xíu nữa nhé!"; } 
        else if (score <= 80) { titleText = "GIỎI LẮM! 😎"; subtitleText = "Cố gắng phát huy nha!"; } 
        else { titleText = "TUYỆT VỜI ÔNG MẶT TRỜI! 🌞"; subtitleText = "Điểm mười không có nhưng!"; }

        showScreen('result-screen');
        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-subtitle').innerText = subtitleText;
        document.getElementById('final-score').innerText = `ĐIỂM: ${score} / 100`;
        document.getElementById('final-time').innerText = `⏱️ TG: ${timeUsed} giây`;

        if(score >= 70) confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
